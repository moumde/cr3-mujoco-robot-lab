name: Public Core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-core:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libglfw3
      - run: python -m pip install -r requirements-core.txt
      - run: python scripts/fetch_cr3.py
      - run: python scripts/check_release.py
      - run: python scripts/test_release.py public-core
